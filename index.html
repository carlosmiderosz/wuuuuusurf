<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>WuuuuSurf Clips</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f172a;
  color: white;
}

header {
  padding: 15px;
  text-align: center;
  font-size: 22px;
  background: #0284c7;
  font-weight: bold;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  padding: 10px;
}

.card {
  position: relative;
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  background: black;
}

.card video {
  width: 100%;
  height: 140px;
  object-fit: cover;
}

.id {
  position: absolute;
  top: 6px;
  left: 6px;
  background: white;
  color: black;
  padding: 3px 6px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: bold;
}

.check {
  position: absolute;
  top: 6px;
  right: 6px;
  width: 22px;
  height: 22px;
  background: limegreen;
  border-radius: 50%;
  display: none;
}

.card.selected .check {
  display: block;
}

.cart {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #020617;
  padding: 12px;
  text-align: center;
  border-top: 1px solid #334155;
}

button {
  padding: 10px 20px;
  background: orange;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  font-size: 14px;
}
</style>
</head>

<body>

<header>🌊 WuuuuSurf - Encuentra tu ola</header>

<div class="grid" id="grid"></div>

<div class="cart">
  🛒 <span id="count">0</span> clips | Total: S/<span id="total">0</span>
  <br><br>
  <button onclick="pagar()">Pagar (Yape / Plin)</button>
</div>

<script>
const price = 10;
let seleccionados = [];

const videos = [
  {id:"001", src:"001_preview.mp4"},
  {id:"002", src:"002_preview.mp4"},
  {id:"003", src:"003_preview.mp4"}
];

const grid = document.getElementById("grid");

videos.forEach(v => {
  let div = document.createElement("div");
  div.className = "card";

  div.innerHTML = `
    <div class="id">#${v.id}</div>
    <div class="check"></div>
    <video muted loop>
      <source src="${v.src}" type="video/mp4">
    </video>
  `;

  div.onclick = () => toggle(v.id, div);

  div.onmouseover = () => div.querySelector("video").play();
  div.onmouseleave = () => div.querySelector("video").pause();

  grid.appendChild(div);
});

function toggle(id, el){
  if(seleccionados.includes(id)){
    seleccionados = seleccionados.filter(v => v !== id);
    el.classList.remove("selected");
  } else {
    seleccionados.push(id);
    el.classList.add("selected");
  }
  actualizar();
}

function actualizar(){
  document.getElementById("count").innerText = seleccionados.length;
  document.getElementById("total").innerText = seleccionados.length * price;
}

function pagar(){
  if(seleccionados.length === 0){
    alert("Selecciona al menos un clip");
    return;
  }

  let lista = seleccionados.join(", ");
  let mensaje = `Hola, quiero estos clips: ${lista} - Total S/${seleccionados.length * price}. Ya hice el pago, te envío comprobante.`;

  window.open(`https://wa.me/51999999999?text=${encodeURIComponent(mensaje)}`, "_blank");
}
</script>

</body>
</html>
