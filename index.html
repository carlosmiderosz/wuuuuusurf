<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>WuuuuSurf Clips</title>

<style>
body {
  font-family: Arial;
  background: #0f172a;
  color: white;
  margin: 0;
}

header {
  padding: 15px;
  text-align: center;
  font-size: 22px;
  background: #0369a1;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  padding: 10px;
}

.card {
  position: relative;
  border-radius: 10px;
  overflow: hidden;
  cursor: pointer;
}

.card iframe {
  width: 100%;
  height: 140px;
}

.id {
  position: absolute;
  top: 5px;
  left: 5px;
  background: white;
  color: black;
  padding: 3px 6px;
  border-radius: 5px;
  font-size: 12px;
}

.check {
  position: absolute;
  top: 5px;
  right: 5px;
  background: green;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  display: none;
}

.card.selected .check {
  display: block;
}

.cart {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #1e293b;
  padding: 10px;
  text-align: center;
}

button {
  padding: 10px;
  background: orange;
  border: none;
  border-radius: 5px;
  font-weight: bold;
}
</style>

</head>

<body>

<header>🌊 WuuuuSurf - Encuentra tu ola</header>

<div class="grid" id="grid"></div>

<div class="cart">
  🛒 <span id="count">0</span> clips | Total: S/<span id="total">0</span>
  <br><br>
  <button onclick="checkout()">Pagar (Yape / Plin)</button>
</div>

<script>
const price = 10;
let cart = [];

const videos = [
  {id:"#001", url:"https://www.youtube.com/embed/dQw4w9WgXcQ"},
  {id:"#002", url:"https://www.youtube.com/embed/dQw4w9WgXcQ"},
  {id:"#003", url:"https://www.youtube.com/embed/dQw4w9WgXcQ"}
];

const grid = document.getElementById("grid");

videos.forEach(v => {
  let div = document.createElement("div");
  div.className = "card";
  div.innerHTML = `
    <div class="id">${v.id}</div>
    <div class="check"></div>
    <iframe src="${v.url}" frameborder="0" allowfullscreen></iframe>
  `;

  div.onclick = () => toggle(v.id, div);
  grid.appendChild(div);
});

function toggle(id, el){
  if(cart.includes(id)){
    cart = cart.filter(x => x !== id);
    el.classList.remove("selected");
  } else {
    cart.push(id);
    el.classList.add("selected");
  }
  update();
}

function update(){
  document.getElementById("count").innerText = cart.length;
  document.getElementById("total").innerText = cart.length * price;
}

function checkout(){
  if(cart.length === 0){
    alert("Selecciona al menos 1 clip");
    return;
  }

  let mensaje = `Hola, quiero estos clips:\n${cart.join(", ")}\nTotal: S/${cart.length * price}`;
  
  window.open(`https://wa.me/51999999999?text=${encodeURIComponent(mensaje)}`);
}
</script>

</body>
</html>
